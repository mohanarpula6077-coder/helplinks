
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpLink | Reset Password</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .reset-box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.1);
        }

        h2 {
            color: #172b4d;
            margin-bottom: 12px;
        }

        p {
            color: #7b8798;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 25px 0 18px;
            border: 1px solid #dce3ed;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1768a5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1768a5;
            text-decoration: none;
        }

        #resetStatus {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="reset-box">
        <h2>Reset Your Password</h2>

        <p>Enter your registered email address. We'll send you a password-reset link.</p>

        <form id="resetForm">
            <input
                type="email"
                id="resetEmail"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">Send Reset Link</button>
            <p id="resetStatus"></p>
        </form>

        <a href="login.html">← Back to Login</a>
    </div>

    <script type="module" src="js/forgot-password.js"></script>

</body>
</html>
